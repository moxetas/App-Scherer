# Cuentas del mes: pruebas en cada push y publicación en GitHub Pages
# cuando hay cambios en la rama principal del repositorio.
#
# Para que publique, una sola vez: Settings → Pages → Build and deployment →
# Source: «GitHub Actions». El sitio publicado mantiene MiTurno en la raíz y
# añade la app de cuentas en /cuentas/.
name: Cuentas del mes

on:
  push:
  pull_request:
    paths:
      - 'cuentas/**'
      - '.github/workflows/cuentas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuentas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cuentas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cuentas/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas del motor de cálculo
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Montar el sitio (MiTurno en la raíz + Cuentas en /cuentas/)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        working-directory: .
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'cuentas' --exclude 'README.md' ./ _site/
          cp -r cuentas/dist _site/cuentas
          touch _site/.nojekyll

      - name: Subir el sitio
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}cuentas/
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
