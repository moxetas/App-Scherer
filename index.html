<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MiTurno</title>
  <meta name="description" content="Prototipo de app de cuadrantes para conductores, en español y alemán.">
  <meta name="theme-color" content="#f3f6f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MiTurno">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button type="button" class="icon-btn" id="nav-btn"></button>
    <h1 id="title">MiTurno</h1>
    <div class="actions" id="actions"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" id="tabs" hidden></nav>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" inert></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="lang/de.js"></script>
  <script src="lang/es.js"></script>
  <script src="lang/pl.js"></script>
  <script src="lang/ro.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/ar.js"></script>
  <script src="lang/fr.js"></script>
  <script src="lang/pt.js"></script>
  <script src="lang/ja.js"></script>

</html>
